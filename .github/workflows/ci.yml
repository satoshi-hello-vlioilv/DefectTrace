# CLAUDE.md の「push 前の確かめ」を GitHub でも回す（型・構文・lint〔ruff・clippy〕・試験）。
# - program: 画面の JS の構文・残っている道具の Python（正解データの取り出し・採点の集計・実データの確かめ）
# - desktop: 窓（Rust・Tauri）と作業用の道具（xtask。版の管理・配る ZIP・試験のロット）の書式・作成・試験（版 3.8 の答えとの突き合わせを含む）と、
#   本物の窓（WebKitGTK）での自己診断・更新の通し。Python は使わない
#   （Windows の WebView2 は desktop.yml）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 型・構文（画面の JS・道具の JS）
        run: bash program/tools/js-check.sh
      - name: 型・構文（Python）
        run: python -m compileall -q program
      # 手元と同じ版の ruff（版が変わると決まりが増えて、手元で通った物が落ちる）
      - name: lint（Python・ruff）
        run: |
          pip install ruff==0.15.20
          ruff check program

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: 窓を作る部品（WebKitGTK）と画面の無い X
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      # 手元と同じ版（clippy は版が上がると決まりが増え、手元で通った物が落ちる）。上げるときは手元と一緒に上げる
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: lint（Rust の書式）
        working-directory: desktop
        run: cargo fmt --check
      - name: typecheck（Rust）
        working-directory: desktop
        run: cargo build --locked
      - name: lint（Rust・clippy）
        working-directory: desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test（Rust・版 3.8 の答えとの突き合わせ・版の管理・配る ZIP を含む）
        working-directory: desktop
        run: cargo test --locked
      - name: 自己診断（本物の窓・WebKitGTK）
        working-directory: desktop
        run: |
          cargo xtask fixture "$RUNNER_TEMP/fx"
          cargo xtask selftest-config "$RUNNER_TEMP/fx" "$RUNNER_TEMP/root"
          exe="$(cargo xtask brand exe | sed 's/\.exe$//')"
          (cd "$RUNNER_TEMP" && DT_LOCAL_ROOT="$RUNNER_TEMP/root" DT_SELFTEST="$RUNNER_TEMP/selftest.json" timeout 240 xvfb-run -a "$GITHUB_WORKSPACE/desktop/target/debug/$exe" || true)
          cargo xtask selftest-report "$RUNNER_TEMP/selftest.json"
      # 更新の通し（desktop/xtask/src/verify.rs）: 共有から写る → 裏で取り込む → 次の起動で入れ替わる → 閉じている間に置いた版に 1 回の起動で入れ替わる → 開けない版は控えへ戻す → 配る版を戻す → 配る入口から新しい PC
      - name: 更新の通し（本物の窓・WebKitGTK）
        working-directory: desktop
        run: xvfb-run -a cargo xtask verify-update --exe "target/debug/$(cargo xtask brand exe | sed 's/\.exe$//')" --work "$RUNNER_TEMP/verify"
      - name: 記録
        if: always()
        run: tail -n 40 "$RUNNER_TEMP"/root/logs/*.log || true
