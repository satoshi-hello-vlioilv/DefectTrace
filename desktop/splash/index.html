<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>起動中</title>
<!--
  デスクトップ版の起動画面（exe に入る）。窓（Rust・src/main.rs）が確かめた事実だけで進み具合を言う:
  ① アプリの中身を探す ② 新しい版を確かめる ③ 画面を開く。
  窓が splash.brand(name, subtitle)（名前は program/app/brand.json の1か所）/ splash.version(v) / splash.step(id, state, detail) /
  splash.fail(title, detail) を呼ぶ。state: wait（まだ）・now（いま）・ok（済んだ）・warn（注意しつつ進む）・bad（止まった）。
  名乗り（アイコン・名前・版）を中央に大きく、そのすぐ下に進み具合を「流れる板と検査のカメラ」で見せる（2 回の案出しと採点で決めた:
  program/tools/proposals/2026-10-27-splash*）。板を段ごとに 3 区間に分け、済んだ区間は検査済みの色と欠陥の印、いまの区間の上に
  カメラが乗って光を落とし、板の上を走査線が走る。絵の下に段の名前（済んだ段に ✓・いまの段を太く）、その下に数と詳しい文。
  止まったら、同じ名乗りの下の白い面に「次にすること」を主に、理由は控えに（コピーできる）。地は画面の見出しと同じ藍。
  icon.png は作るとき build.rs が program/app/app_icon.py で描く（256px）。
-->
<style>
 :root{
  --navy:#1c3550; --blue:#2b5f79; --deep:#0f1f30; --teal:#2f7d78; --mint:#7fd3c9; --amber:#e6a52e; --coral:#ff8a7a;
  --ink:#1b2733; --muted:#5d6b77; --line:#dbe3e9; --warn:#8a5a00; --code:#f5f7f9;
 }
 *{box-sizing:border-box}
 html,body{height:100%;margin:0}
 body{display:grid;place-content:center;background:radial-gradient(ellipse at 50% 35%,var(--blue) 0%,var(--navy) 55%,var(--deep) 100%);color:#fff;
  font-family:"Yu Gothic UI","Segoe UI",Meiryo,system-ui,sans-serif;font-size:15px;line-height:1.6;overflow:hidden}
 [hidden]{display:none!important}

 /* 名乗り */
 .hero{display:flex;flex-direction:column;align-items:center;text-align:center;width:min(820px,90vw)}
 .logo{width:112px;height:112px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4));transition:width .3s,height .3s}
 h1{margin:22px 0 0;font:700 44px/1.15 "Segoe UI Variable Display","Segoe UI","Yu Gothic UI",sans-serif;letter-spacing:.01em}
 .sub{margin-top:4px;font-size:18px;opacity:.82}
 .ver{margin-top:12px;min-height:12px;font:600 11px/1 "Segoe UI",sans-serif;letter-spacing:.2em;opacity:.78}

 /* 進み具合: 流れる板の 3 区間とカメラ。まだ＝淡い区間、済んだ＝青緑の区間と欠陥の印（注意で進んだ段はアンバー）、いま＝カメラと光と走査線、止まった＝珊瑚 */
 .run{width:720px;margin-top:40px}
 .seg{display:block;width:720px;height:140px;overflow:visible}
 .seg .sec{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.2);stroke-width:1}
 .seg .dots,.seg .cam,.seg .lamp,.seg .cone,.seg .beam{opacity:0}
 .seg .cam{fill:#3b5d7a;stroke:#bff3ec;stroke-width:1}.seg .lamp{fill:#bff3ec}.seg .cone{fill:rgba(127,211,201,.26)}.seg .beam{fill:#e8fffb}
 .seg .ok .sec{fill:rgba(127,211,201,.2);stroke:var(--mint)}.seg .ok .dots{opacity:1}
 .seg .warn .sec{fill:rgba(230,165,46,.18);stroke:var(--amber)}.seg .warn .dots{opacity:1}
 .seg .bad .sec{fill:rgba(255,138,122,.14);stroke:var(--coral)}
 .seg .now .sec{stroke:#bff3ec}.seg .now .cam,.seg .now .lamp,.seg .now .beam{opacity:1}
 .seg .now .cone{opacity:1;animation:breathe 1.4s ease-in-out infinite}.seg .now .beam{animation:sweep 1.5s linear infinite}
 @keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
 @keyframes sweep{from{transform:translateX(0)}to{transform:translateX(200px)}}
 .legs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;font-size:13.5px;color:rgba(255,255,255,.72);text-align:center}
 .legs .now{color:#fff;font-weight:700}.legs .ok{color:var(--mint)}.legs .ok::before{content:"✓ "}.legs .warn{color:var(--amber)}.legs .warn::before{content:"! "}
 .legs .bad{color:var(--coral);font-weight:700}
 .step{display:flex;justify-content:center;gap:10px;margin-top:12px;font-size:12.5px;opacity:.78;min-height:19px}
 .count{font-variant-numeric:tabular-nums;white-space:nowrap}
 .detail{max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 /* 下に敷く板とローラーの淡い断面（何も伝えない飾り。読む物の後ろには来ない） */
 .motif{position:fixed;left:0;bottom:0;width:100%;height:46vh;pointer-events:none}
 .motif .strip{fill:rgba(127,211,201,.04)}.motif .roll{fill:none;stroke:rgba(127,211,201,.08);stroke-width:3}
 .hero{position:relative;z-index:1}
 .elapsed{position:fixed;right:24px;bottom:18px;font:12px Consolas,monospace;opacity:.6}

 /* 止まったとき: 名乗りを小さくし、白い面に「次にすること」（主）と理由（控え・コピーできる） */
 body.is-fail .run{display:none}
 body.is-fail .logo{width:72px;height:72px}
 body.is-fail h1{margin-top:12px;font-size:30px}
 .panel{width:min(820px,90vw);margin-top:34px;padding:24px 28px;border-radius:16px;background:#fff;color:var(--ink);text-align:left;box-shadow:0 24px 60px rgba(0,0,0,.35)}
 .panel h2{margin:0;font-size:20px}
 .lead{color:var(--muted);font-size:13px}
 .next{margin-top:14px;padding:14px 16px;border:1px solid #f0d9a8;border-left:4px solid var(--amber);border-radius:10px}
 .label{display:flex;align-items:center;justify-content:space-between;color:var(--warn);font-size:13px;font-weight:700;letter-spacing:.04em}
 .next p{margin:2px 0 0;font-size:15px;font-weight:600;line-height:1.7}
 .why{margin-top:14px}
 .why pre{margin:6px 0 0;max-height:180px;overflow:auto;padding:10px 12px;border-radius:8px;background:var(--code);color:var(--muted);
  font:12px/1.6 Consolas,monospace;white-space:pre-wrap;word-break:break-all}
 .copy{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0;cursor:pointer}
 .copy:hover{border-color:var(--teal);color:var(--teal)}
 .copy:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

 @media (prefers-reduced-motion:reduce){.seg .now .cone,.seg .now .beam{animation:none}.logo{transition:none}}
</style>
</head>
<body>
<svg class="motif" id="motif" viewBox="0 0 1600 400" preserveAspectRatio="none" aria-hidden="true"></svg>
<main class="hero" aria-labelledby="name">
  <img class="logo" src="icon.png" alt="">
  <h1 id="name"></h1>
  <div class="sub" id="subtitle"></div>
  <div class="ver" id="version"></div>
  <section class="run" aria-live="polite" aria-label="起動の進み具合">
    <svg class="seg" id="seg" viewBox="0 0 720 140" aria-hidden="true"></svg>
    <div class="legs" id="legs"></div>
    <div class="step"><span class="count" id="count"></span><span class="detail" id="stepDetail"></span></div>
  </section>
  <section class="panel" id="panel" role="alert" aria-labelledby="failTitle" hidden>
    <h2 id="failTitle"></h2>
    <div class="lead">直したら、この窓を閉じて開き直してください。</div>
    <div class="next" id="next" hidden><div class="label">次にすること</div><p id="nextText"></p></div>
    <div class="why"><div class="label">理由<button type="button" class="copy" id="copy">理由をコピー</button></div><pre id="why"></pre></div>
  </section>
</main>
<span class="elapsed" id="elapsed">0.0 秒</span>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const t0 = performance.now();
  const sec = () => ((performance.now() - t0) / 1000).toFixed(1);
  const timer = setInterval(() => { $("#elapsed").textContent = sec() + " 秒"; }, 100);
  /* 段（窓が step で伝える id の順）。detail は窓が伝えるまでの説明 */
  const STEPS = [
    { id: "program", title: "アプリの中身を探す", detail: "exe と並ぶ program フォルダ", state: "now" },
    { id: "update", title: "新しい版を確かめる", detail: "配る置き場（設定の update_source）", state: "wait" },
    { id: "open", title: "画面を開く", detail: "", state: "wait" },
  ];
  const CURRENT = ["now", "warn", "bad"];
  /* よくある理由 → 次にすること（理由の文から見分ける。当てはまらなければ理由だけ出す） */
  const HINTS = [
    [/program フォルダ|index\.html/, "配られた ZIP を展開したフォルダの exe から開いてください（exe と program フォルダが並んでいる形）。"],
    [/WebView2/, "Microsoft Edge WebView2 ランタイムを入れてから開き直してください（Windows 11 には入っています）。"],
    [/作業場所|書けません/, "この PC の作業場所（%LOCALAPPDATA%\\DefectTrace）に書けるか確かめてから開き直してください。"],
    [/配る版|取り込めません/, "配る置き場に届くか（共有フォルダ・同期の済み具合）を確かめてから開き直してください。"],
  ];
  /* 欠陥の印（画面の MAP と同じ: ● 穴 赤・▲ 汚れ 青・■ キズ 緑・★ 周期 橙） */
  function mark(k, x, y, r) {
    const c = ["#e0412c", "#4c8dff", "#2fbf71", "#e6a52e"][k];
    if (k === 0) return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
    if (k === 2) return `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" fill="${c}"/>`;
    const pts = k === 1 ? [[0, -1], [1, 1], [-1, 1]]
      : [...Array(10)].map((_, i) => { const a = -Math.PI / 2 + (i * Math.PI) / 5, m = i % 2 ? 0.45 : 1; return [Math.cos(a) * m, Math.sin(a) * m]; });
    return `<path d="M${pts.map(([px, py]) => `${(x + px * r).toFixed(1)} ${(y + py * r).toFixed(1)}`).join("L")}Z" fill="${c}"/>`;
  }
  /* 段ごとの区間: 板（済むと検査済みの色と欠陥の印）・その上のカメラと光・板の上を走る走査線。印の置き場は決まった乱数で毎回同じ */
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const W = 720 / STEPS.length, SY = 106;
  $("#seg").innerHTML = STEPS.map((_, i) => {
    const x = i * W, cx = x + W / 2;
    let dots = "";
    // 6 つの印を区間の 6 つの枠に 1 つずつ（触れ合わない）
    for (let k = 0; k < 6; k++) dots += mark(k % 4, x + 20 + (k + 0.2 + rnd() * 0.6) * ((W - 40) / 6), SY + 7 + rnd() * 12, 4.2);
    return `<g><path class="cone" d="M${cx - 7} 40 L${x + 14} ${SY} L${x + W - 14} ${SY} L${cx + 7} 40Z"/>`
      + `<rect class="sec" x="${x + 6}" y="${SY}" width="${W - 12}" height="26" rx="2"/><g class="dots">${dots}</g>`
      + `<rect class="beam" x="${x + 8}" y="${SY - 2}" width="3" height="30"/>`
      + `<rect class="cam" x="${cx - 28}" y="10" width="56" height="30" rx="5"/><circle class="lamp" cx="${cx}" cy="25" r="6"/></g>`;
  }).join("");
  $("#legs").innerHTML = STEPS.map((s) => `<span>${s.title}</span>`).join("");
  $("#motif").innerHTML = '<rect class="strip" x="0" y="330" width="1600" height="14"/>'
    + [100, 420, 740, 1060, 1380].map((x) => `<circle class="roll" cx="${x}" cy="372" r="26"/>`).join("");

  /** 段の状態を、板の区間・段の名前・いまの 1 段の文に描く */
  function paint() {
    STEPS.forEach((s, i) => { $("#seg").children[i].setAttribute("class", s.state); $("#legs").children[i].className = s.state; });
    const i = STEPS.findIndex((s) => CURRENT.includes(s.state));
    const cur = STEPS[i < 0 ? STEPS.length - 1 : i];
    $("#stepDetail").textContent = cur.detail;
    $("#count").textContent = `${i < 0 ? STEPS.length : i + 1} / ${STEPS.length}`;
  }

  window.splash = {
    brand(name, subtitle) {
      $("#name").textContent = name;
      $("#subtitle").textContent = subtitle;
      document.title = name + " — 起動中";
    },
    version(v) { $("#version").textContent = v ? "VER " + v : ""; },
    step(id, state, detail) {
      const k = STEPS.findIndex((s) => s.id === id);
      if (k < 0) return;
      STEPS[k].state = state;
      if (detail) STEPS[k].detail = detail;
      const next = STEPS[k + 1];
      if (state === "ok" && next && next.state === "wait") next.state = "now";
      paint();
    },
    fail(title, detail) {
      clearInterval(timer);
      $("#elapsed").textContent = sec() + " 秒";
      STEPS.forEach((s) => { if (s.state === "now") s.state = "bad"; });
      paint();
      $("#failTitle").textContent = title;
      const hint = HINTS.find(([re]) => re.test(title + "\n" + detail));
      $("#next").hidden = !hint;
      $("#nextText").textContent = hint ? hint[1] : "";
      $("#why").textContent = detail;
      $("#panel").hidden = false;
      document.body.classList.add("is-fail");
      document.title = title;
    },
  };

  /* 理由をコピー（問い合わせるときに写せる）。クリップボードが使えなければ選んで写す */
  $("#copy").onclick = async () => {
    const text = $("#why").textContent;
    try { await navigator.clipboard.writeText(text); } catch (_) {
      const r = document.createRange(); r.selectNodeContents($("#why"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand("copy");
    }
    $("#copy").textContent = "コピーしました";
    setTimeout(() => { $("#copy").textContent = "理由をコピー"; }, 1600);
  };
  paint();
})();
</script>
</body>
</html>
